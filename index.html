<h1>NutIn</h1>
<p>NutIn is a personal health data pipeline run by one person for their own use.
It reads that person's own activity, sleep and health metrics so they can review
them in a weekly summary.</p>
<p>It is not a public service. It has no other users and does not accept sign-ups.</p>
